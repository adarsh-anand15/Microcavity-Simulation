name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android_app/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: pip install --upgrade buildozer cython

      - name: Cache buildozer global + .buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_app/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android_app/buildozer.spec', '.github/workflows/android-build.yml') }}

      - name: Build debug APK
        working-directory: android_app
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: microcavity-sim-debug-apk
          path: android_app/bin/*.apk
